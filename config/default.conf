# STermux 默认配置
# 用户自定义值请写入 user.conf，不要直接修改本文件。

ST_PATH="$HOME/SillyTavern"

# Git 网络命令的最长等待时间（秒）。
GIT_NETWORK_TIMEOUT_SECONDS=60

# protective、scheduled、catchup 共用的自动备份池保留上限。
AUTOMATIC_BACKUP_KEEP=2

# Phase 5 轻量自动备份；默认关闭，启动 STermux 时检查一次。
AUTO_BACKUP_ENABLED=false
AUTO_BACKUP_INTERVAL_DAYS=7

# 默认将备份保存在 STermux 项目内；可在 user.conf 中覆盖为其他安全目录。
BACKUP_ROOT="$STERMUX_ROOT/backups/sillytavern"

# SillyTavern 本体更新前创建 protective 数据备份。
AUTO_BACKUP_BEFORE_UPDATE=true

# 打开新的 Termux 交互式 Shell 时是否自动进入 STermux；默认关闭。
AUTO_ENTER_MANAGER=false

# 终端支持颜色时是否显示颜色；NO_COLOR 环境变量仍可强制关闭。
COLOR_ENABLED=true
